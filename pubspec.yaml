name: shadow_relic
description: "Shadow Relic : un Metroidvania complet en Flutter + Flame."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  shared_preferences: ^2.2.3
  vector_math: ^2.2.0
  flame_audio: ^2.12.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flame_test: ^2.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/sfx/
    - assets/audio/music/
  fonts:
    - family: KenneyFuture
      fonts:
        - asset: assets/fonts/KenneyFuture.ttf
    - family: KenneyMini
      fonts:
        - asset: assets/fonts/KenneyMiniSquare.ttf
